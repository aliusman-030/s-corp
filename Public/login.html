<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Login - S-CORP</title>
    <link rel="stylesheet" href="style.css">
<style>
    body {
        background: #1a1a1a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    
    .login-container {
        width: 100%;
        max-width: 420px;
    }
    
    .login-box {
        background: #000000;
        border-radius: 15px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        border: 2px solid #ff4757;
        position: relative;
        overflow: hidden;
    }
    
    .login-box:before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #ff4757, #ff3838, #ff0000);
        z-index: -1;
        border-radius: 17px;
        animation: borderGlow 3s ease infinite;
    }
    
    @keyframes borderGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
    }
    
    .logo {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .logo h1 {
        color: white;
        font-size: 36px;
        margin-bottom: 10px;
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(255, 71, 87, 0.5);
    }
    
    .logo p {
        color: #ff4757;
        font-size: 16px;
        letter-spacing: 1px;
        font-weight: 500;
    }
    
    .form-group {
        margin-bottom: 25px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: white;
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    .form-group input {
        width: 100%;
        padding: 15px 20px;
        background: #1a1a1a;
        border: 2px solid #333;
        border-radius: 10px;
        font-size: 16px;
        color: white;
        transition: all 0.3s ease;
        font-family: inherit;
    }
    
    .form-group input::placeholder {
        color: #666;
    }
    
    .form-group input:focus {
        border-color: #ff4757;
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.2);
    }
    
    .form-group input:not(:placeholder-shown) {
        border-color: #ff4757;
    }
    
    .submit-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-top: 10px;
        position: relative;
        overflow: hidden;
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
    }
    
    .submit-btn:active {
        transform: translateY(-1px);
    }
    
    .submit-btn:before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s ease;
    }
    
    .submit-btn:hover:before {
        left: 100%;
    }
    
    .message {
        text-align: center;
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        font-weight: bold;
        font-size: 14px;
        display: none;
        border: 1px solid transparent;
    }
    
    .message.success {
        background: rgba(46, 204, 113, 0.1);
        color: #2ecc71;
        border-color: #2ecc71;
        display: block;
    }
    
    .message.error {
        background: rgba(255, 71, 87, 0.1);
        color: #ff4757;
        border-color: #ff4757;
        display: block;
    }
    
    .links {
        text-align: center;
        margin-top: 25px;
        padding-top: 25px;
        border-top: 1px solid #333;
    }
    
    .links a {
        color: #ff4757;
        text-decoration: none;
        margin: 0 15px;
        font-weight: 600;
        font-size: 14px;
        transition: color 0.3s ease;
        position: relative;
        padding-bottom: 5px;
    }
    
    .links a:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: #ff4757;
        transition: width 0.3s ease;
    }
    
    .links a:hover {
        color: white;
    }
    
    .links a:hover:after {
        width: 100%;
    }
    
     
    .loading {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255,255,255,.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin-right: 10px;
        vertical-align: middle;
    }
    
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    
    /* Input focus animation */
    @keyframes inputPulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }
    
    .form-group input:focus {
        animation: inputPulse 1.5s infinite;
    }
    
    /* Mobile fixes */
    @media (max-width: 480px) {
        body {
            padding: 15px;
            align-items: flex-start;
            padding-top: 30px;
        }
        
        .login-container {
            max-width: 100%;
            margin: 0;
        }
        
        .login-box {
            padding: 30px 20px;
            border-radius: 12px;
        }
        
        .logo h1 {
            font-size: 28px;
        }
        
        .form-group input {
            padding: 14px 16px;
            font-size: 16px;
        }
        
        .submit-btn {
            padding: 14px;
            font-size: 16px;
            min-height: 44px;
        }
        
        .links a {
            display: block;
            margin: 10px 0;
            text-align: center;
        }
        
        .links span {
            display: none;
        }
    }
    
    @media (max-width: 768px) {
        input, select, textarea {
            font-size: 16px !important;
        }
    }
</style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h1>S-CORP</h1>
                <p>Make Money Easy</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="btnText">Login</span>
                </button>
                
                <div id="message" class="message"></div>
            </form>
            
            <div class="links">
                <a href="signup.html">Create New Account</a>
                <span style="color: #ccc">|</span>
                <a href="index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const message = document.getElementById('message');
            
            // Save original text
            const originalText = btnText.textContent;
            
            // Show loading
            btnText.innerHTML = '<div class="loading"></div> Logging in...';
            btn.disabled = true;
            message.className = 'message';
            message.textContent = '';
            
            // Get form data
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    message.textContent = '✅ ' + result.message;
                    message.className = 'message success';
                    
                    // Store user info
                    localStorage.setItem('user_email', data.email);
                    
                    // Redirect based on user type
                    setTimeout(() => {
                        if (data.email === 'admin@site.com') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'home.html';
                        }
                    }, 1000);
                    
                } else {
                    message.textContent = '❌ ' + result.message;
                    message.className = 'message error';
                    btnText.textContent = originalText;
                    btn.disabled = false;
                }
                
            } catch (error) {
                message.textContent = '❌ Connection error. Check server is running.';
                message.className = 'message error';
                btnText.textContent = originalText;
                btn.disabled = false;
                console.error('Login error:', error);
            }
        });
        
        // Auto-focus email field
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('email').focus();
        });
    </script>
</body>
</html>
