<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Sign Up - S-CORP</title>
    <style>
        body {
            background: #1a1a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        .signup-container {
            width: 100%;
            max-width: 450px;
        }
        
        .signup-box {
            background: #000000;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 2px solid #ff4757;
            position: relative;
            overflow: hidden;
        }
        
        .signup-box:before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff4757, #ff3838, #ff0000);
            z-index: -1;
            border-radius: 17px;
            animation: borderGlow 3s ease infinite;
        }
        
        @keyframes borderGlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: white;
            font-size: 36px;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(255, 71, 87, 0.5);
        }
        
        .logo p {
            color: #ff4757;
            font-size: 16px;
            letter-spacing: 1px;
            font-weight: 500;
        }
        
        .referral-info {
            background: rgba(255, 71, 87, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }
        
        .referral-info p {
            color: #ffa502;
            font-size: 14px;
            margin: 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-group input::placeholder {
            color: #666;
        }
        
        .form-group input:focus {
            border-color: #ff4757;
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.2);
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3);
        }
        
        .message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            display: none;
            border: 1px solid transparent;
        }
        
        .message.success {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border-color: #2ecc71;
            display: block;
        }
        
        .message.error {
            background: rgba(255, 71, 87, 0.1);
            color: #ff4757;
            border-color: #ff4757;
            display: block;
        }
        
        .links {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #333;
        }
        
        .links a {
            color: #ff4757;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 600;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .links a:hover {
            color: white;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .signup-box { padding: 30px 20px; }
            .logo h1 { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-box">
            <div class="logo">
                <h1>S-CORP</h1>
                <p>Start Earning Today</p>
            </div>
            
            <div id="referralInfo" class="referral-info" style="display: none;">
                <p>🎉 You were referred by someone! Complete signup to earn bonus.</p>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span id="btnText">Create Account</span>
                </button>
                
                <div id="message" class="message"></div>
            </form>
            
            <div class="links">
                <a href="login.html">Already have an account? Login</a>
                <span style="color: #ccc">|</span>
                <a href="index.html">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Function to get referral code from URL
        function getReferralCodeFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('ref') || '';
        }
        
        // Show referral info if exists
        const referralCode = getReferralCodeFromURL();
        if (referralCode) {
            document.getElementById('referralInfo').style.display = 'block';
            console.log('🔗 Referral code detected:', referralCode);
        }
        
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const message = document.getElementById('message');
            
            const originalText = btnText.textContent;
            
            btnText.innerHTML = '<div class="loading"></div> Creating account...';
            btn.disabled = true;
            message.className = 'message';
            message.textContent = '';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const referralCode = getReferralCodeFromURL();
            
            if (password !== confirmPassword) {
                message.textContent = '❌ Passwords do not match';
                message.className = 'message error';
                btnText.textContent = originalText;
                btn.disabled = false;
                return;
            }
            
            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        confirmPassword: confirmPassword,
                        referralCode: referralCode
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    message.textContent = '✅ ' + result.message + ' Your referral code: ' + result.referral;
                    message.className = 'message success';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    message.textContent = '❌ ' + result.message;
                    message.className = 'message error';
                    btnText.textContent = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                message.textContent = '❌ Connection error. Please try again.';
                message.className = 'message error';
                btnText.textContent = originalText;
                btn.disabled = false;
                console.error('Signup error:', error);
            }
        });
        
        document.getElementById('email').focus();
    </script>
</body>
</html>
